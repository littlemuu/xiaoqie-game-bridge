name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run build
      - run: npm audit
      - run: git diff --check

  windows-operator:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Confirm the hosted Windows host is elevated
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal]::new(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "The hosted Windows runner was expected to be elevated."
          }
      - name: Verify the product fails closed on the elevated host
        run: npm test -- --run tests/windows-containment.test.ts
        env:
          XIAOQIE_EXPECT_ELEVATED_HOST: "1"
      - run: npm run build
      - run: npm audit
      - run: git diff --check
