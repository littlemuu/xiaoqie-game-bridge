name: check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  platform-neutral:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm audit
      - run: git diff --check

  windows-operator:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Confirm the hosted Windows host is elevated
        shell: pwsh
        run: |
          $principal = [Security.Principal.WindowsPrincipal]::new(
            [Security.Principal.WindowsIdentity]::GetCurrent()
          )
          if (-not $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)) {
            throw "The hosted Windows runner was expected to be elevated."
          }
      - name: Verify elevated-host rejection (not the non-elevated product path)
        shell: pwsh
        run: |
          $env:XIAOQIE_EXPECT_ELEVATED_HOST = "1"
          npm test -- --run tests/windows-containment.test.ts
      - run: npm audit
      - run: git diff --check
