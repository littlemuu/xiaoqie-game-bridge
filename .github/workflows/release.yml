name: rc-release

on:
  push:
    tags: ["v*-rc.*"]

permissions:
  contents: read

jobs:
  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Fail closed unless this is the protected annotated version tag at this commit
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          test "$REF_PROTECTED" = "true"
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v${version}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag"
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run demo
      - run: npm run build
      - run: npm audit
      - run: npm run release:workflow-policy
      - run: npm run release:reproducible
      - name: Build and verify the exact release evidence
        run: npm run release:build -- --expected-commit "$GITHUB_SHA" --expected-ref "$GITHUB_REF"
      - run: npm run release:verify -- --expected-commit "$GITHUB_SHA" --expected-ref "$GITHUB_REF"
      - run: git diff --check
      - name: Create GitHub artifact attestation for the canonical bundle
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: release-out/*.tar.gz
      - name: Create a draft prerelease and upload only the release allowlist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release create "$GITHUB_REF_NAME" \
            release-out/*.tar.gz \
            release-out/*.sha256 \
            release-out/*.sbom.cdx.json \
            release-out/*.release-manifest.json \
            release-out/*.provenance.json \
            --verify-tag --prerelease --draft \
            --title "$GITHUB_REF_NAME" \
            --notes-file docs/release-notes-v0.1.0-rc.1.md
      - name: Redownload and verify digests plus attestation before publishing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          download="$RUNNER_TEMP/xiaoqie-release-download"
          mkdir "$download"
          gh release download "$GITHUB_REF_NAME" --dir "$download"
          node scripts/release.mjs verify --output "$download" --expected-commit "$GITHUB_SHA" --expected-ref "$GITHUB_REF"
          gh attestation verify "$download"/*.tar.gz --repo "$GITHUB_REPOSITORY"
      - name: Publish the already verified prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --draft=false --prerelease
